name: apt repository

# Publishes https://minhngoc2512.github.io/status-bar as a signed flat apt
# repository. The pool is rebuilt from the .deb assets attached to releases, so
# the site is a pure function of what has been released -- nothing to keep in
# sync by hand.
on:
  # Called by release.yml: a release created with GITHUB_TOKEN does not fire the
  # `release` event, so the publish step has to be invoked directly.
  workflow_call:
  # Fires when a release is made by hand, with a personal token.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Collect every released package
        run: |
          mkdir -p dist
          # gh api rather than `gh release list --json`: the flag is missing on
          # older gh, and this works the same on any version.
          for tag in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name'); do
            # Releases from before the rename carry claude-status_*.deb; those
            # are deliberately left out so the index holds one package name.
            gh release download "$tag" --dir dist --pattern 'status-bar_*.deb' --clobber || true
          done
          ls -la dist

      - name: Import the signing key
        env:
          PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "APT_GPG_PRIVATE_KEY is not set. Create it with" >&2
            echo "  packaging/apt/make-signing-key.sh" >&2
            echo "An unsigned repository would force every user to add [trusted=yes]." >&2
            exit 1
          fi
          gpg --version | head -1
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # Needed by the loopback fallback in build-apt-repo.sh; harmless
          # otherwise. no-tty stops gpg reaching for a terminal that is not there.
          echo allow-loopback-pinentry >> ~/.gnupg/gpg-agent.conf
          echo no-tty >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$PRIVATE_KEY" | gpg --batch --import \
            || printf '%s\n' "$PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase "" --import
          echo "APT_SIGN_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')" >> "$GITHUB_ENV"

      # TEMPORARY: gpg 2.4 on the runner refuses to sign with a key that signs
      # fine on 2.2 here. This dumps enough state to tell whether the imported
      # key is stored protected, and which invocation the runner accepts.
      - name: Diagnose the imported key
        continue-on-error: true
        run: |
          set +e
          echo "--- key files ---"
          for f in ~/.gnupg/private-keys-v1.d/*.key; do
            echo "$(basename "$f"): $(head -c 30 "$f" | tr -dc '[:print:]')"
          done
          echo "--- agent ---"
          cat ~/.gnupg/gpg-agent.conf 2>/dev/null
          gpgconf --list-options gpg-agent | grep -i pinentry
          echo "--- signing variants ---"
          echo data > /tmp/d
          gpg --batch --yes --default-key "$APT_SIGN_KEY" --clearsign -o /tmp/a.asc /tmp/d
          echo "  plain                 rc=$?"
          gpg --batch --yes --pinentry-mode loopback --default-key "$APT_SIGN_KEY" --clearsign -o /tmp/b.asc /tmp/d </dev/null
          echo "  loopback              rc=$?"
          printf '' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --default-key "$APT_SIGN_KEY" --clearsign -o /tmp/c.asc /tmp/d
          echo "  loopback passphrase-fd rc=$?"
          GPG_TTY= gpg --batch --yes --no-tty --default-key "$APT_SIGN_KEY" --clearsign -o /tmp/e.asc /tmp/d </dev/null
          echo "  plain no-tty          rc=$?"

      - name: Build the repository
        env:
          APT_REPO_URL: https://minhngoc2512.github.io/status-bar
        run: ./build-apt-repo.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
